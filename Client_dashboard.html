<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your TravelBunny account</title>
<style>
  :root{ --green:#568c68; --dark:#0b1710; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--dark);color:#fff;min-height:100vh}
  .wrap{max-width:720px;margin:0 auto;padding:40px 20px}
  .brand{font-weight:800;letter-spacing:-.02em;margin-bottom:24px;font-size:20px}
  .brand strong{color:var(--green)}
  .brand span{color:#fff}
  .card{background:#fff;color:var(--dark);border-radius:16px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  h1{font-size:26px;margin:0 0 16px}
  h2{font-size:18px;margin:24px 0 10px}
  .muted{color:#666;font-size:14px}
  label{font-weight:600;font-size:14px;display:block;margin:12px 0 6px}
  input,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #ddd;border-radius:8px}
  textarea{min-height:80px;font-family:inherit}
  button{background:var(--green);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:16px;font-weight:700;cursor:pointer;margin-top:16px}
  .logout{float:right;background:transparent;color:#888;margin-top:-6px}
  .msg{min-height:20px;font-size:14px;margin-top:10px}
  .msg.err{color:#b00020}.msg.ok{color:#2e7d32}
  .hidden{display:none}
  .status{display:inline-block;background:#eef4ef;color:#2e7d32;padding:4px 12px;border-radius:20px;font-size:14px;font-weight:700}
  .update,.comment{background:#f4f6f4;border-radius:8px;padding:12px;margin:8px 0}
  .when{font-size:12px;color:#888;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">travel<strong>Bunny</strong><span>.</span></div>

  <div class="card" id="login-card">
    <h1>Welcome back</h1>
    <p class="muted">Log in to view your project progress, updates, and messages with your TravelBunny specialist.</p>
    <form id="login-form">
      <label for="login-email">Email</label><input id="login-email" type="email" autocomplete="email" required>
      <label for="login-pass">Password</label><input id="login-pass" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <div class="msg" id="login-status"></div>
    </form>
  </div>

  <div class="card hidden" id="dash">
    <button class="logout" id="logout">Log out</button>
    <h1 id="hello">Hi</h1>
    <p class="muted">Here's the current state of your project. Message your specialist below.</p>
    <h2>Your project</h2>
    <p><span class="status" id="status"></span> &nbsp; <span id="service"></span></p>
    <h2>Updates</h2><div id="updates"><p class="muted">No updates yet.</p></div>
    <h2>Comments &amp; requests</h2><div id="comments"><p class="muted">No comments yet.</p></div>
    <form id="comment-form">
      <textarea id="comment-text" placeholder="Ask a question or request a change…"></textarea>
      <button type="submit">Send to your specialist</button>
      <div class="msg" id="comment-status"></div>
    </form>
  </div>
</div>
<script>
(function(){
  const BASE = "https://us-central1-makkymgbemena-webpage.cloudfunctions.net";
  const params = new URLSearchParams(window.location.search);
  const emailInput = document.getElementById("login-email");
  if (params.get("email")) emailInput.value = params.get("email");

  const loginCard = document.getElementById("login-card");
  const dash = document.getElementById("dash");
  const loginStatus = document.getElementById("login-status");
  const commentStatus = document.getElementById("comment-status");
  const form = document.getElementById("login-form");
  const commentForm = document.getElementById("comment-form");

  let token = sessionStorage.getItem("tb_token") || "";
  let userEmail = sessionStorage.getItem("tb_email") || "";

  const showMsg = (el, m, isErr) => { el.textContent = m || ""; el.className = "msg" + (isErr ? " err" : " ok"); };
  const strip = (s) => { try { const d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; } catch(e){ return ""; } };

  function render(u){
    document.getElementById("hello").textContent = "Hi " + ((u.firstName || u.lastName || u.email) || "there") + " 👋";
    document.getElementById("status").textContent = u.status || "In progress";
    document.getElementById("service").textContent = u.service || "";
    const ups = (u.updates || []);
    document.getElementById("updates").innerHTML = ups.length ? ups.map(x=>`<div class="update">${strip(x.text)}<div class="when">${new Date(x.at).toLocaleString()}</div></div>`).join("") : '<p class="muted">No updates yet.</p>';
    const cms = (u.comments || []);
    document.getElementById("comments").innerHTML = cms.length ? cms.map(x=>`<div class="comment">${strip(x.text)}<div class="when">${new Date(x.at).toLocaleString()}</div></div>`).join("") : '<p class="muted">No comments yet.</p>';
  }
  async function post(path, body){
    const r = await fetch(BASE + path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
    return {status:r.status, data: await r.json().catch(()=>({}))};
  }
  async function loadProject(){
    if (!token) return;
    try{
      const {data} = await post("/getProject", {email:userEmail, token});
      if (data.user){ render(data.user); loginCard.classList.add("hidden"); dash.classList.remove("hidden"); }
      else { sessionStorage.removeItem("tb_token"); sessionStorage.removeItem("tb_email"); token=""; userEmail=""; }
    }catch(e){ console.error(e); }
  }

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const email = emailInput.value.trim().toLowerCase();
    const password = document.getElementById("login-pass").value;
    showMsg(loginStatus, "Logging in…", false);
    try{
      const {status, data} = await post("/loginUser", {email, password});
      if (status !== 200 || !data.token) throw new Error(data.error || "Login failed.");
      token = data.token; userEmail = data.user.email;
      sessionStorage.setItem("tb_token", token); sessionStorage.setItem("tb_email", userEmail);
      render(data.user); loginCard.classList.add("hidden"); dash.classList.remove("hidden");
    }catch(err){ showMsg(loginStatus, err.message, true); }
  });

  commentForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    const text = document.getElementById("comment-text").value.trim();
    if (!text) return;
    showMsg(commentStatus, "Sending…", false);
    try{
      const {status, data} = await post("/addProjectComment", {email:userEmail, token, comment:text});
      if (status !== 200) throw new Error(data.error || "Could not send.");
      document.getElementById("comment-text").value = "";
      showMsg(commentStatus, "Sent!", false);
      render({email:userEmail, status:"", updates:[], comments:data.comments});
    }catch(err){ showMsg(commentStatus, err.message, true); }
  });

  document.getElementById("logout").addEventListener("click", ()=>{
    sessionStorage.removeItem("tb_token"); sessionStorage.removeItem("tb_email");
    token=""; userEmail=""; location.href = "/client-dashboard.html";
  });

  loadProject();
})();
</script>
</body>
</html>
